name: Diagnostic validation (temporary)

on:
  push:
    branches: [diag-validation]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: curl -sSL -o validator_cli.jar https://github.com/hapifhir/org.hl7.fhir.core/releases/latest/download/validator_cli.jar
      - name: Validate each bundle (full logs)
        run: |
          mkdir -p report
          for f in patients/*/bundle.json; do
            n=$(basename $(dirname $f))
            java -jar validator_cli.jar "$f" -version 4.0.1 -ig hl7.fhir.us.core#6.1.0 -ig hl7.fhir.us.carin-bb#2.1.0 > "report/$n.txt" 2>&1 || true
          done
      - name: Save logs to the diag-validation-results branch
        run: |
          git config user.name "validation-bot"
          git config user.email "validation-bot@users.noreply.github.com"
          git checkout --orphan diag-validation-results
          git rm -rq --cached . || true
          git add report
          git commit -qm "Validation logs"
          git push -f origin diag-validation-results
