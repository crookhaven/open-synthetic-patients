name: FHIR validation

# Runs on every pull request so it can be a required check. When a pull request
# changes nothing the validator looks at, the job passes straight away.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fhir-validation:
    name: FHIR validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether patient data or validation settings changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
              | grep -qE '^(patients/|tools/check_validation\.py|tools/validation_known_issues\.json|\.github/workflows/fhir-validation\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No patient data or validation settings changed, so validation was skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download the HL7 FHIR validator
        if: steps.changes.outputs.run == 'true'
        # Pinned so a new validator release can't fail the check on its own.
        run: curl -sSL -o validator_cli.jar https://github.com/hapifhir/org.hl7.fhir.core/releases/download/7.0.2/validator_cli.jar
      - name: Validate every bundle (fails on errors not in tools/validation_known_issues.json)
        if: steps.changes.outputs.run == 'true'
        run: python3 tools/check_validation.py --validator validator_cli.jar --logs validation-logs
      - name: Keep the full validator logs
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fhir-validation-logs
          path: validation-logs/
